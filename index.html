<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>USP Weekly Operations Calendar</title>

  <style>
    :root{
      --bg:#ffffff;
      --panel:#f5f7fb;
      --grid:#e1e5ee;
      --text:#111827;
      --muted:#4b5563;

      --wh:#dbeafe;
      --in:#fde68a;
      --tu:#bbf7d0;
      --op:#e9d5ff;
      --we:#ffe4e6;

      --tr:#cffafe;
      --dr:#fed7aa;
      --off:#f1f5f9;

      --rowH:90px;
      --empColW:210px;
      --nameFS:20px;
      --taskFS:22px;
      --projFS:16px;
      --cellPadY:8px;
      --cellPadX:10px;
      --cellGap:5px;
      --cellRadius:6px;
      --cellInset:2px;
    }

    *{
      box-sizing:border-box;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }

    html,body{
      height:100%;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      overflow:auto;
      overscroll-behavior:contain;
    }

    header{
      position:sticky;
      top:0;
      z-index:50;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 28px 14px;
      border-bottom:2px solid var(--grid);
      background:#ffffff;
      gap:18px;
    }

    .header-left{
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
      flex:1 1 auto;
    }

    h1{
      margin:0;
      font-size:32px;
      letter-spacing:.3px;
    }

    .sub{
      font-size:18px;
      color:var(--muted);
    }

    .tabs{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .tab{
      appearance:none;
      border:1px solid var(--grid);
      background:#ffffff;
      color:var(--text);
      padding:10px 14px;
      border-radius:999px;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
    }

    .tab.active{
      background:#111827;
      color:#ffffff;
      border-color:#111827;
    }

    .header-right{
      display:flex;
      align-items:center;
      gap:18px;
      flex:0 0 auto;
    }

    .legend{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
      font-size:13px;
      color:var(--muted);
      max-width:620px;
    }

    .tag{
      display:flex;
      align-items:center;
      gap:6px;
    }

    .sw{
      width:16px;
      height:11px;
      border-radius:4px;
      border:1px solid rgba(0,0,0,.2);
      flex:0 0 auto;
    }

    .logo{
      height:46px;
      width:auto;
      object-fit:contain;
      flex:0 0 auto;
    }

    main{
      padding:18px 22px 28px;
    }

    .board{
      width:100%;
      table-layout:fixed;
      border-collapse:separate;
      border-spacing:0;
      background:#ffffff;
      border:2px solid var(--grid);
      border-radius:14px;
      overflow:hidden;
    }

    .board thead th{
      background:var(--panel);
      padding:10px 10px;
      font-size:20px;
      border-bottom:2px solid var(--grid);
      text-align:center;
      font-weight:800;
      position:sticky;
      top:0;
      z-index:5;
    }

    .date-label{
      font-size:14px;
      color:#6b7280;
      font-weight:700;
      line-height:1.1;
      margin-bottom:3px;
    }

    .day-label{
      font-size:20px;
      font-weight:900;
      line-height:1.1;
    }

    .board thead th.today .date-label{
      color:#d1d5db;
    }

    .board th.employee{
      width:var(--empColW);
      text-align:left;
      padding-left:18px;
    }

    .board td,
    .board tbody th{
      height:var(--rowH);
      padding:0;
      border-right:1px solid var(--grid);
      border-bottom:1px solid var(--grid);
      vertical-align:middle;
      background:#fff;
    }

    .board tbody th{
      padding:0 12px;
      font-weight:800;
      letter-spacing:.4px;
      background:#ffffff;
      font-size:var(--nameFS);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .cell{
      width:calc(100% - (var(--cellInset) * 2));
      height:calc(100% - (var(--cellInset) * 2));
      margin:var(--cellInset);
      border-radius:var(--cellRadius);
      padding:var(--cellPadY) var(--cellPadX);
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:var(--cellGap);
      border:0;
    }

    .big{
      font-size:var(--taskFS);
      font-weight:900;
      line-height:1.08;
      overflow:hidden;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:2;
    }

    .small{
      font-size:var(--projFS);
      color:#111827;
      line-height:1.12;
      overflow:hidden;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:1;
      opacity:.82;
    }

    .board thead th.today{
      background:#111827;
      color:#ffffff;
    }

    .board td.today{
      background:#fef3c7;
    }

    .board td.today .cell{
      box-shadow:inset 0 0 0 3px #111827;
    }

    .cell.off{
      background:var(--off)!important;
      opacity:.92;
      border:0;
      filter:grayscale(.10);
    }

    .cell.off .big,
    .cell.off .small{
      color:rgba(17,24,39,.72);
    }
  </style>
</head>

<body>

<header>
  <div class="header-left">
    <div>
      <h1>USP Weekly Operations Calendar</h1>
      <div class="sub" id="weekLabel">Loading week…</div>
    </div>

    <div class="tabs" id="tabs"></div>
  </div>

  <div class="header-right">
    <div class="legend">
      <div class="tag"><span class="sw" style="background:var(--op)"></span>Office</div>
      <div class="tag"><span class="sw" style="background:var(--wh)"></span>Warehouse</div>
      <div class="tag"><span class="sw" style="background:var(--in)"></span>Install</div>
      <div class="tag"><span class="sw" style="background:var(--tu)"></span>Turf</div>
      <div class="tag"><span class="sw" style="background:var(--we)"></span>Wellness</div>
      <div class="tag"><span class="sw" style="background:var(--tr)"></span>Travel</div>
      <div class="tag"><span class="sw" style="background:var(--dr)"></span>Driving</div>
      <div class="tag"><span class="sw" style="background:var(--off)"></span>Off</div>
    </div>

    <img src="./usp-logo.png" alt="Urban Soccer Park" class="logo" />
  </div>
</header>

<main>
  <table class="board" id="board"></table>
</main>

<script>
const CSV_URL = "YOUR_CSV_URL_HERE";

const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

const AUTO_CYCLE_WEEKS = true;
const CYCLE_SECONDS = 20;

let cycleTimer = null;
let allRows = [];
let selectedWeekStart = "";

function mondayOfThisWeekISO(){
  const d = new Date();
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);

  d.setDate(d.getDate() + diff);

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const da = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${da}`;
}

function normalizeWeekStartISO(weekStart){
  let d;

  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(weekStart)) {
    const parts = weekStart.split("-");
    d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  else if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(weekStart)) {
    const parts = weekStart.split("/");
    d = new Date(Number(parts[2]), Number(parts[0]) - 1, Number(parts[1]));
  }
  else {
    d = new Date(weekStart);
  }

  if (isNaN(d.getTime())) return "";

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");

  return `${y}-${m}-${day}`;
}

function isDisplayedWeekCurrentWeek(weekStart){
  if (!weekStart) return false;

  const thisMonday = mondayOfThisWeekISO();
  const displayedMonday = normalizeWeekStartISO(weekStart);

  return displayedMonday === thisMonday;
}

function getTodayAbbrev(){
  return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()];
}

function getDateForDay(weekStart, offset){
  if (!weekStart) return "";

  let d;

  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(weekStart)) {
    const parts = weekStart.split("-");
    d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  else if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(weekStart)) {
    const parts = weekStart.split("/");
    d = new Date(Number(parts[2]), Number(parts[0]) - 1, Number(parts[1]));
  }
  else {
    d = new Date(weekStart);
  }

  if (isNaN(d.getTime())) return "";

  d.setDate(d.getDate() + offset);

  return `${d.getMonth()+1}/${d.getDate()}`;
}

function parseCSV(text){
  const rows = text.trim().split("\n").map(r => r.split(","));

  const header = rows.shift().map(h => h.trim().toLowerCase());

  return rows.map(r => {
    const obj = {};
    header.forEach((h,i) => obj[h] = (r[i] || "").trim());
    return obj;
  });
}

function normDay(x){
  return (x || "").slice(0,3);
}

function normalizeDept(d=""){
  d = d.toLowerCase();

  if (d.startsWith("op")) return "operations";
  if (d.startsWith("ware")) return "warehouse";
  if (d.startsWith("inst")) return "installation";
  if (d.startsWith("turf")) return "turf";
  if (d.startsWith("well")) return "wellness";
  if (d.startsWith("driv")) return "driving";

  return d;
}

function isOffRow(r){
  const task = (r.task || "").toLowerCase();
  return task.includes("off") || task.includes("pto");
}

function isTravelRow(r){
  return (r.dept || "").toLowerCase().includes("travel");
}

function isDrivingRow(r){
  return (r.dept || "").toLowerCase().includes("driv");
}

function getCellBg(r){
  if (isOffRow(r)) return "var(--off)";
  if (isDrivingRow(r)) return "var(--dr)";
  if (isTravelRow(r)) return "var(--tr)";

  const d = normalizeDept(r.dept || "");

  if (d === "warehouse") return "var(--wh)";
  if (d === "installation") return "var(--in)";
  if (d === "turf") return "var(--tu)";
  if (d === "operations") return "var(--op)";
  if (d === "wellness") return "var(--we)";

  return "#ffffff";
}

function buildTabs(weekStarts){
  const el = document.getElementById("tabs");
  el.innerHTML = "";

  if (weekStarts.length <= 1) return;

  weekStarts.forEach((ws, i) => {
    const btn = document.createElement("button");

    btn.className = "tab" + (ws === selectedWeekStart ? " active" : "");
    btn.textContent = i === 0 ? "This Week" : "Next Week";

    btn.onclick = () => {
      selectedWeekStart = ws;
      render();
    };

    el.appendChild(btn);
  });
}

function setupAutoCycle(weekStarts){
  if (cycleTimer) clearInterval(cycleTimer);

  if (!AUTO_CYCLE_WEEKS || weekStarts.length < 2) return;

  cycleTimer = setInterval(() => {
    const currentIndex = weekStarts.indexOf(selectedWeekStart);

    const nextIndex = currentIndex === -1
      ? 0
      : (currentIndex + 1) % weekStarts.length;

    selectedWeekStart = weekStarts[nextIndex];

    render();
  }, CYCLE_SECONDS * 1000);
}

function buildBoard(records){
  const weekStart = records[0]?.week_start || "";

  document.getElementById("weekLabel").textContent =
    weekStart ? `Week of ${weekStart}` : "";

  const today = getTodayAbbrev();
  const shouldHighlightToday = isDisplayedWeekCurrentWeek(weekStart);

  const byEmployee = {};

  records.forEach(r => {
    if (!byEmployee[r.employee]) byEmployee[r.employee] = {};
    byEmployee[r.employee][normDay(r.day)] = r;
  });

  const employeeSort = {};

  Object.keys(byEmployee).forEach(e => {
    const row = records.find(r => r.employee === e);
    employeeSort[e] = Number(row?.sort_order || 9999);
  });

  const employees = Object.keys(byEmployee).sort((a,b)=>{
    return (employeeSort[a] - employeeSort[b]) || a.localeCompare(b);
  });

  const table = document.getElementById("board");
  table.innerHTML = "";

  const thead = document.createElement("thead");
  const hr = document.createElement("tr");

  const th0 = document.createElement("th");
  th0.className = "employee";
  th0.textContent = "EMPLOYEE";
  hr.appendChild(th0);

  for (let i=0; i<DAYS.length; i++){
    const d = DAYS[i];

    const th = document.createElement("th");

    th.innerHTML = `
      <div class="date-label">${getDateForDay(weekStart, i)}</div>
      <div class="day-label">${d.toUpperCase()}</div>
    `;

    if (shouldHighlightToday && d === today){
      th.classList.add("today");
    }

    hr.appendChild(th);
  }

  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  employees.forEach(e => {
    const tr = document.createElement("tr");

    const th = document.createElement("th");
    th.textContent = e.toUpperCase();

    tr.appendChild(th);

    DAYS.forEach(d => {
      const td = document.createElement("td");

      if (shouldHighlightToday && d === today){
        td.classList.add("today");
      }

      const r = byEmployee[e][d];

      if (r){
        const bg = getCellBg(r);
        const off = isOffRow(r);

        td.innerHTML = `
          <div class="cell ${off ? "off" : ""}" style="background:${bg}">
            <div class="big">${r.task || ""}</div>
            <div class="small">${r.project || ""}</div>
          </div>
        `;
      }

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
}

function render(){
  const weekStarts = [...new Set(allRows.map(r => r.week_start))].sort();

  if (!selectedWeekStart){
    selectedWeekStart = weekStarts[0];
  }

  buildTabs(weekStarts);

  const filtered = allRows.filter(r => r.week_start === selectedWeekStart);

  buildBoard(filtered);

  setupAutoCycle(weekStarts);
}

async function init(){
  const res = await fetch(CSV_URL,{cache:"no-store"});
  const text = await res.text();

  allRows = parseCSV(text);

  render();

  setTimeout(init,120000);
}

init();
</script>

</body>
</html>

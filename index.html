<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>USP Weekly Operations Calendar</title>

  <style>
    :root{
      --bg:#ffffff;
      --panel:#f5f7fb;
      --grid:#e1e5ee;
      --text:#111827;
      --muted:#4b5563;

      --wh:#dbeafe;
      --in:#fde68a;
      --tu:#bbf7d0;
      --op:#e9d5ff;
      --we:#ffe4e6;

      --tr:#cffafe;
      --dr:#fed7aa;
      --off:#f1f5f9;

      --rowH:90px;
      --empColW:210px;
      --nameFS:20px;
      --taskFS:22px;
      --projFS:16px;
      --cellPadY:8px;
      --cellPadX:10px;
      --cellGap:5px;
      --cellRadius:6px;
      --cellInset:2px;
    }

    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;}
    html,body{height:100%;}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      overflow:auto;
      overscroll-behavior:contain;
    }

    header{
      position:sticky;
      top:0;
      z-index:50;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 28px 14px;
      border-bottom:2px solid var(--grid);
      background:#ffffff;
      gap:18px;
    }

    .header-left{
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
      flex:1 1 auto;
    }

    h1{margin:0;font-size:32px;letter-spacing:.3px;}
    .sub{font-size:18px;color:var(--muted);}

    .tabs{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .tab{
      appearance:none;
      border:1px solid var(--grid);
      background:#ffffff;
      color:var(--text);
      padding:10px 14px;
      border-radius:999px;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
    }

    .tab.active{
      background:#111827;
      color:#ffffff;
      border-color:#111827;
    }

    .header-right{
      display:flex;
      align-items:center;
      gap:18px;
      flex:0 0 auto;
    }

    .legend{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
      font-size:13px;
      color:var(--muted);
      max-width:620px;
    }

    .tag{display:flex;align-items:center;gap:6px;}
    .sw{
      width:16px;
      height:11px;
      border-radius:4px;
      border:1px solid rgba(0,0,0,.2);
      flex:0 0 auto;
    }

    .logo{
      height:46px;
      width:auto;
      object-fit:contain;
      flex:0 0 auto;
    }

    main{padding:18px 22px 28px;}

    .board{
      width:100%;
      table-layout:fixed;
      border-collapse:separate;
      border-spacing:0;
      background:#ffffff;
      border:2px solid var(--grid);
      border-radius:14px;
      overflow:hidden;
    }

    .board thead th{
      background:var(--panel);
      padding:10px 10px;
      font-size:20px;
      border-bottom:2px solid var(--grid);
      text-align:center;
      font-weight:800;
      position:sticky;
      top:0;
      z-index:5;
    }

    .date-label{
      font-size:14px;
      color:#6b7280;
      font-weight:700;
      line-height:1.1;
      margin-bottom:3px;
    }

    .day-label{
      font-size:20px;
      font-weight:900;
      line-height:1.1;
    }

    .board thead th.today{
      background:#111827;
      color:#ffffff;
    }

    .board thead th.today .date-label{
      color:#d1d5db;
    }

    .board th.employee{
      width:var(--empColW);
      text-align:left;
      padding-left:18px;
    }

    .board td,
    .board tbody th{
      height:var(--rowH);
      padding:0;
      border-right:1px solid var(--grid);
      border-bottom:1px solid var(--grid);
      vertical-align:middle;
      background:#fff;
    }

    .board tbody th{
      padding:0 12px;
      font-weight:800;
      letter-spacing:.4px;
      background:#ffffff;
      font-size:var(--nameFS);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .cell{
      width:calc(100% - (var(--cellInset) * 2));
      height:calc(100% - (var(--cellInset) * 2));
      margin:var(--cellInset);
      border-radius:var(--cellRadius);
      padding:var(--cellPadY) var(--cellPadX);
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:var(--cellGap);
      border:0;
    }

    .big{
      font-size:var(--taskFS);
      font-weight:900;
      line-height:1.08;
      overflow:hidden;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:2;
    }

    .small{
      font-size:var(--projFS);
      color:#111827;
      line-height:1.12;
      overflow:hidden;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:1;
      opacity:.82;
    }

    .board td.today{
      background:#fef3c7;
    }

    .board td.today .cell{
      box-shadow:inset 0 0 0 3px #111827;
    }

    .cell.off{
      background:var(--off)!important;
      opacity:.92;
      border:0;
      filter:grayscale(.10);
    }

    .cell.off .big,
    .cell.off .small{
      color:rgba(17,24,39,.72);
    }

    .project-board th,
    .project-board td{
      height:72px;
    }

    .project-board .big{
      font-size:22px;
      -webkit-line-clamp:1;
    }

    .project-board .small{
      font-size:18px;
      -webkit-line-clamp:1;
      opacity:.95;
    }

    .status-not-started{
  background:#ef4444 !important;
  color:white;
}

.status-picking{
  background:#a855f7 !important;
  color:white;
}

.status-pre-build{
  background:#3b82f6 !important;
  color:white;
}

.status-packing{
  background:#f97316 !important;
  color:white;
}

.status-packed{
  background:#86efac !important;
}

.status-storage{
  background:#fde047 !important;
}

.status-shipped{
  background:#15803d !important;
  color:white;
}

.status-not-started .big,
.status-picking .big,
.status-pre-build .big,
.status-packing .big,
.status-shipped .big,
.status-not-started .small,
.status-picking .small,
.status-pre-build .small,
.status-packing .small,
.status-shipped .small{
  color:white;
}
  </style>
</head>

<body>
<header>
  <div class="header-left">
    <div>
      <h1>USP Weekly Operations Calendar</h1>
      <div class="sub" id="weekLabel">Loading…</div>
    </div>

    <div class="tabs" id="tabs"></div>
  </div>

  <div class="header-right">
    <div class="legend" aria-label="Color legend">
      <div class="tag"><span class="sw" style="background:var(--op)"></span>Office</div>
      <div class="tag"><span class="sw" style="background:var(--wh)"></span>Warehouse</div>
      <div class="tag"><span class="sw" style="background:var(--in)"></span>Install</div>
      <div class="tag"><span class="sw" style="background:var(--tu)"></span>Turf</div>
      <div class="tag"><span class="sw" style="background:var(--we)"></span>Wellness</div>
      <div class="tag"><span class="sw" style="background:var(--tr)"></span>Travel</div>
      <div class="tag"><span class="sw" style="background:var(--dr)"></span>Driving</div>
      <div class="tag"><span class="sw" style="background:var(--off)"></span>Off</div>
    </div>

    <img src="./usp-logo.png" alt="Urban Soccer Park" class="logo" />
  </div>
</header>

<main>
  <table class="board" id="board"></table>
</main>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS9dYykqhLDctkDUvYOrX5buK09uK1hHaryxnro6YiHltFPKyTCkd_ji_pWWdIPfy-XdlNB-XhTMv0-/pub?gid=0&single=true&output=csv";

const PROJECTS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS9dYykqhLDctkDUvYOrX5buK09uK1hHaryxnro6YiHltFPKyTCkd_ji_pWWdIPfy-XdlNB-XhTMv0-/pub?gid=823636530&single=true&output=csv";

const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

const AUTO_CYCLE_WEEKS = true;
const CYCLE_SECONDS = 60;

let cycleTimer = null;
let allRows = [];
let projectRows = [];
let selectedWeekStart = "";
let currentViewMode = "schedule";
let lastEmployeeCount = 0;

const FIT_LIMIT = 19;

function applySizingForRowH(rowH){
  const nameFS = Math.max(12, Math.min(22, Math.floor(rowH * 0.28)));
  const taskFS = Math.max(14, Math.min(24, Math.floor(rowH * 0.34)));
  const projFS = Math.max(11, Math.min(18, Math.floor(rowH * 0.24)));

  const cellPadY = Math.max(5, Math.min(10, Math.floor(rowH * 0.12)));
  const cellPadX = Math.max(7, Math.min(12, Math.floor(rowH * 0.15)));
  const cellGap  = Math.max(3, Math.min(6, Math.floor(rowH * 0.06)));

  const empColW = Math.max(175, Math.min(255, Math.floor(window.innerWidth * 0.13)));

  const root = document.documentElement.style;
  root.setProperty("--rowH", `${rowH}px`);
  root.setProperty("--nameFS", `${nameFS}px`);
  root.setProperty("--taskFS", `${taskFS}px`);
  root.setProperty("--projFS", `${projFS}px`);
  root.setProperty("--cellPadY", `${cellPadY}px`);
  root.setProperty("--cellPadX", `${cellPadX}px`);
  root.setProperty("--cellGap", `${cellGap}px`);
  root.setProperty("--empColW", `${empColW}px`);
}

function applyAutoFitToViewport(numEmployees){
  lastEmployeeCount = numEmployees;

  let rowH = Math.floor((window.innerHeight * 0.62) / Math.max(numEmployees, 1));
  rowH = Math.max(44, Math.min(92, rowH));
  applySizingForRowH(rowH);

  if (numEmployees <= FIT_LIMIT){
    const header = document.querySelector("header");
    const table = document.getElementById("board");
    const main = document.querySelector("main");

    const headerH = header ? header.getBoundingClientRect().height : 160;
    const ms = main ? getComputedStyle(main) : null;
    const padTop = ms ? parseFloat(ms.paddingTop) : 18;
    const padBottom = ms ? parseFloat(ms.paddingBottom) : 28;
    const available = window.innerHeight - headerH - padTop - padBottom;

    const thead = table ? table.querySelector("thead") : null;
    let tableHeaderH = thead ? thead.getBoundingClientRect().height : 64;
    if (!tableHeaderH || tableHeaderH < 40) tableHeaderH = 64;

    let minRowH = 40;

    for (let i=0; i<20; i++){
      const tbody = table ? table.querySelector("tbody") : null;
      const bodyH = tbody ? tbody.getBoundingClientRect().height : (rowH * numEmployees);
      const needed = tableHeaderH + bodyH;

      if (needed <= available) break;

      rowH -= 2;
      if (rowH < minRowH) break;
      applySizingForRowH(rowH);
    }
  }
}

window.addEventListener("resize", () => {
  if (lastEmployeeCount) requestAnimationFrame(() => applyAutoFitToViewport(lastEmployeeCount));
});

function parseCSV(text){
  const rows = [];
  let row = [], cur = "", inQ = false;

  for (let i=0; i<text.length; i++){
    const c = text[i], n = text[i+1];

    if (c === '"' && inQ && n === '"'){
      cur += '"';
      i++;
      continue;
    }

    if (c === '"'){
      inQ = !inQ;
      continue;
    }

    if (c === "," && !inQ){
      row.push(cur);
      cur = "";
      continue;
    }

    if ((c === "\n" || c === "\r") && !inQ){
      if (cur.length || row.length){
        row.push(cur);
        rows.push(row);
      }
      row = [];
      cur = "";
      continue;
    }

    cur += c;
  }

  if (cur.length || row.length){
    row.push(cur);
    rows.push(row);
  }

  const rawHeader = (rows.shift() || []).map(h => (h || "").trim().toLowerCase());

  const header = rawHeader.map(h => {
    if (h === "default department") return "default_department";
    if (h === "department") return "dept";
    if (h === "person" || h === "employee") return "employee";
    if (h === "week" || h === "week of") return "week_start";
    if (h === "sort order" || h === "sort_order") return "sort_order";
    return h.replace(/\s+/g, "_");
  });

  return rows
    .map(r => {
      const obj = {};
      header.forEach((h,idx) => obj[h] = (r[idx] || "").trim());
      return obj;
    })
    .filter(r => Object.values(r).some(v => v !== ""));
}

function normalizeDept(d=""){
  d = d.toLowerCase().trim();

  if (!d) return "";
  if (d.startsWith("op") || d.startsWith("office")) return "operations";
  if (d.startsWith("ware")) return "warehouse";
  if (d.startsWith("inst")) return "installation";
  if (d.startsWith("turf")) return "turf";
  if (d.startsWith("well")) return "wellness";
  if (d.startsWith("driv")) return "driving";

  return d;
}

function mondayOfThisWeekISO(){
  const d = new Date();
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);

  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const da = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${da}`;
}

function normalizeWeekStartISO(weekStart){
  let d;

  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(weekStart)) {
    const parts = weekStart.split("-");
    d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  else if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(weekStart)) {
    const parts = weekStart.split("/");
    d = new Date(Number(parts[2]), Number(parts[0]) - 1, Number(parts[1]));
  }
  else {
    d = new Date(weekStart);
  }

  if (isNaN(d.getTime())) return "";

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");

  return `${y}-${m}-${day}`;
}

function getISODateForDay(weekStart, offset){
  const startISO = normalizeWeekStartISO(weekStart);
  if (!startISO) return "";

  const parts = startISO.split("-");
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  d.setDate(d.getDate() + offset);

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}

function getDateForDay(weekStart, offset){
  const iso = getISODateForDay(weekStart, offset);
  if (!iso) return "";

  const parts = iso.split("-");
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));

  return `${d.getMonth()+1}/${d.getDate()}`;
}

function formatShortDate(d){
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[d.getMonth()]} ${d.getDate()}`;
}

function getWeekRangeLabel(weekStart){
  const startISO = normalizeWeekStartISO(weekStart);
  if (!startISO) return weekStart || "";

  const parts = startISO.split("-");
  const start = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  const end = new Date(start);
  end.setDate(start.getDate() + 6);

  return `${formatShortDate(start)}–${formatShortDate(end)}`;
}

function getWeekPositionLabel(weekStart, weekStarts){
  const index = weekStarts.indexOf(weekStart);
  const labels = ["This Week", "Next Week", "2 Weeks Out", "3 Weeks Out"];
  return labels[index] || `Week ${index + 1}`;
}

function getTodayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function normDay(x){
  const s = (x || "").trim();
  const d3 = s.slice(0,3).toLowerCase();
  if (!d3) return "";
  return d3.charAt(0).toUpperCase() + d3.slice(1);
}

function isOffRow(r){
  const dept = normalizeDept(r.dept || "");
  const task = ((r.task || "")).toLowerCase().trim();

  return dept === "off" ||
         task === "off" ||
         task === "pto" ||
         task.startsWith("off ") ||
         task.startsWith("pto ");
}

function isTravelRow(r){
  const dept = (r.dept || "").toLowerCase().trim();
  const text = ((r.task || "") + " " + (r.project || "")).toLowerCase();

  return dept.startsWith("trav") || text.includes("travel");
}

function isDrivingRow(r){
  const dept = (r.dept || "").toLowerCase().trim();
  const text = ((r.task || "") + " " + (r.project || "")).toLowerCase();

  return dept.startsWith("driv") || text.includes("driving");
}

function getCellBg(r){
  if (isOffRow(r)) return "var(--off)";
  if (isDrivingRow(r)) return "var(--dr)";
  if (isTravelRow(r)) return "var(--tr)";

  const d = normalizeDept(r.dept || "");

  if (d === "warehouse") return "var(--wh)";
  if (d === "installation") return "var(--in)";
  if (d === "turf") return "var(--tu)";
  if (d === "operations") return "var(--op)";
  if (d === "wellness") return "var(--we)";
  if (d === "driving") return "var(--dr)";

  return "#ffffff";
}

function getViewList(weekStarts){
  const views = weekStarts.map((ws, i) => ({
    type: "schedule",
    id: ws,
    label: getWeekPositionLabel(ws, weekStarts)
  }));

  if (projectRows.length){
    views.push({
      type: "projects",
      id: "projects",
      label: "Projects"
    });
  }

  return views;
}

function buildTabs(views){
  const el = document.getElementById("tabs");
  el.innerHTML = "";

  if (views.length <= 1) return;

  views.forEach(v => {
    const btn = document.createElement("button");

    const active = currentViewMode === v.type &&
      (v.type === "projects" || selectedWeekStart === v.id);

    btn.className = "tab" + (active ? " active" : "");
    btn.textContent = v.label;

    btn.onclick = () => {
      if (v.type === "projects"){
        currentViewMode = "projects";
        buildProjectsBoard();
      } else {
        currentViewMode = "schedule";
        selectedWeekStart = v.id;
        render();
      }
    };

    el.appendChild(btn);
  });
}

function setupAutoCycle(views){
  if (cycleTimer) clearInterval(cycleTimer);

  if (!AUTO_CYCLE_WEEKS || views.length < 2) return;

  cycleTimer = setInterval(() => {
    const currentId = currentViewMode === "projects" ? "projects" : selectedWeekStart;
    const currentIndex = views.findIndex(v => v.id === currentId);
    const nextIndex = currentIndex === -1 ? 0 : (currentIndex + 1) % views.length;
    const next = views[nextIndex];

    if (next.type === "projects"){
      currentViewMode = "projects";
      buildProjectsBoard();
    } else {
      currentViewMode = "schedule";
      selectedWeekStart = next.id;
      render();
    }
  }, CYCLE_SECONDS * 1000);
}

function buildScheduleBoard(records){
  const weekStart = (records[0]?.week_start) || "";
  const weekStarts = [...new Set(allRows.map(r => r.week_start).filter(Boolean))].sort();

  const weekPosition = getWeekPositionLabel(weekStart, weekStarts);
  const weekRange = getWeekRangeLabel(weekStart);

  document.getElementById("weekLabel").textContent =
    weekStart ? `${weekPosition} • ${weekRange}` : "";

  const todayISO = getTodayISO();

  const byEmployee = new Map();

  for (const r of records){
    if (!r.employee || !r.day) continue;

    if (!byEmployee.has(r.employee)){
      byEmployee.set(r.employee, []);
    }

    byEmployee.get(r.employee).push(r);
  }

  const dayIndexByEmployee = new Map();

  for (const e of byEmployee.keys()){
    dayIndexByEmployee.set(e, {});
  }

  for (const r of records){
    const e = r.employee;
    if (!e) continue;

    const d = normDay(r.day);
    if (!DAYS.includes(d)) continue;

    dayIndexByEmployee.get(e)[d] = r;
  }

  const employeeSort = {};

  for (const [e, recs] of byEmployee.entries()){
    const raw = recs.find(r => (r.sort_order || "").trim() !== "")?.sort_order || "9999";
    const sortVal = Number(raw);
    employeeSort[e] = Number.isFinite(sortVal) ? sortVal : 9999;
  }

  const employees = [...byEmployee.keys()].sort((a,b)=>{
    return (employeeSort[a] - employeeSort[b]) || a.localeCompare(b);
  });

  const table = document.getElementById("board");
  table.className = "board";
  table.innerHTML = "";

  const thead = document.createElement("thead");
  const hr = document.createElement("tr");

  const th0 = document.createElement("th");
  th0.className = "employee";
  th0.textContent = "EMPLOYEE";
  hr.appendChild(th0);

  for (let i = 0; i < DAYS.length; i++){
    const d = DAYS[i];
    const th = document.createElement("th");

    const dateLabel = getDateForDay(weekStart, i);
    const columnISO = getISODateForDay(weekStart, i);

    th.innerHTML = `
      <div class="date-label">${dateLabel}</div>
      <div class="day-label">${d.toUpperCase()}</div>
    `;

    if (columnISO === todayISO){
      th.classList.add("today");
    }

    hr.appendChild(th);
  }

  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  for (const e of employees){
    const tr = document.createElement("tr");

    const th = document.createElement("th");
    th.textContent = e.toUpperCase();
    tr.appendChild(th);

    const perDay = dayIndexByEmployee.get(e) || {};

    for (let i = 0; i < DAYS.length; i++){
      const d = DAYS[i];
      const td = document.createElement("td");
      const columnISO = getISODateForDay(weekStart, i);

      if (columnISO === todayISO){
        td.classList.add("today");
      }

      const r = perDay[d];

      if (r){
        const off = isOffRow(r);
        const bg = getCellBg(r);

        const taskTxt = (r.task || "").trim();
        const projTxt = (r.project || "").trim();

        const big = off
          ? (taskTxt.toUpperCase().startsWith("PTO") ? "PTO" : "OFF")
          : (taskTxt || projTxt);

        const small = off ? "" : (projTxt || "");

        td.innerHTML = `
          <div class="cell ${off ? "off" : ""}" style="background:${bg}">
            <div class="big">${big || ""}</div>
            ${small ? `<div class="small">${small}</div>` : ``}
          </div>
        `;
      }

      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  }

  table.appendChild(tbody);

  requestAnimationFrame(() => applyAutoFitToViewport(employees.length));
}

function getProjectCellClass(header, value){
  const h = (header || "").toLowerCase().trim();
  const v = (value || "").toLowerCase().trim();

  if (h === "status"){
    if (v === "not started") return "status-not-started";
    if (v === "picking") return "status-picking";
    if (v === "pre-build") return "status-pre-build";
    if (v === "packing") return "status-packing";
    if (v === "packed") return "status-packed";
    if (v === "storage") return "status-storage";
    if (v === "shipped") return "status-shipped";
  }

  return "";
}
  
function buildProjectsBoard(){
  currentViewMode = "projects";

  document.getElementById("weekLabel").textContent = "Projects";

  const weekStarts = [...new Set(allRows.map(r => r.week_start).filter(Boolean))].sort();
  const views = getViewList(weekStarts);
  buildTabs(views);
  setupAutoCycle(views);

  const table = document.getElementById("board");
  table.className = "board project-board";
  table.innerHTML = "";

  const headers = [
  "Project Name",
  "Ship Date",
  "Size",
  "Model",
  "Install Team",
  "Install Date",
  "Status"
];

  const thead = document.createElement("thead");
  const hr = document.createElement("tr");

  headers.forEach(h => {
    const th = document.createElement("th");
    th.textContent = h.toUpperCase();
    hr.appendChild(th);
  });

  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  projectRows
    .filter(r => r.project_name || r["project name"])
    .forEach(r => {
      const tr = document.createElement("tr");

      const values = [
  r.project_name || r["project name"] || "",
  r.ship_date || r["ship date"] || "",
  r.size || "",
  r.model || "",
  r.install_team || r["install team"] || "",
  r.install_date || r["install date"] || "",
  r.status || ""
];

      values.forEach((v, i) => {
  const td = document.createElement("td");

  const cellClass = getProjectCellClass(headers[i], v);

  td.innerHTML = `
    <div class="cell ${cellClass}" style="background:#f8fafc">
      <div class="${i === 0 ? "big" : "small"}">${v}</div>
    </div>
  `;

  tr.appendChild(td);
});

function render(){
  const weekStarts = [...new Set(allRows.map(r => r.week_start).filter(Boolean))].sort();

  if (!selectedWeekStart){
    const thisMon = mondayOfThisWeekISO();
    selectedWeekStart = weekStarts.includes(thisMon)
      ? thisMon
      : (weekStarts[0] || "");
  }

  const views = getViewList(weekStarts);
  buildTabs(views);

  if (currentViewMode === "projects"){
    buildProjectsBoard();
    return;
  }

  const filtered = selectedWeekStart
    ? allRows.filter(r => r.week_start === selectedWeekStart)
    : allRows;

  buildScheduleBoard(filtered);
  setupAutoCycle(views);
}

async function init(){
  const [scheduleRes, projectsRes] = await Promise.all([
    fetch(CSV_URL,{cache:"no-store"}),
    fetch(PROJECTS_CSV_URL,{cache:"no-store"})
  ]);

  const scheduleText = await scheduleRes.text();
  const projectsText = await projectsRes.text();

  allRows = parseCSV(scheduleText).filter(r => r.employee && r.day);
  projectRows = parseCSV(projectsText);

  render();

  setTimeout(init,120000);
}

init();
</script>
</body>
</html>
